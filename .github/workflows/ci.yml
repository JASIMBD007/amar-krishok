name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amar_krishok_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amar_krishok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amar_krishok_test?schema=public
      DEFAULT_LOCALE: bn-BD
      DISPLAY_TIME_ZONE: Asia/Dhaka
      JWT_SECRET: ci-only-secret-that-is-never-used-in-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix mobile
      - run: npm run backend:prisma:generate
      - run: npm --prefix backend run prisma:deploy
      - run: npm run seed
      - run: npm run test:p0
      - run: npm run test:dashboards
      - run: npm run test:mobile-role
      - run: npm run lint
      - run: npm run build
      - run: npm run backend:build
      - run: npm run mobile:check
