services:
  - type: web
    name: amar-krishok-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run prisma:deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://www.amarkrishok.com,https://amarkrishok.com,https://amarkrishok.netlify.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
