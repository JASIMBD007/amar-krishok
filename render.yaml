services:
  - type: web
    name: amar-krishok-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # Stated rather than left to the default: the API sat several commits behind main with the
    # migration unapplied, which is what an unnoticed auto-deploy toggle looks like from outside.
    autoDeploy: true
    # geo:country downloads a CC0 IP-to-country table. It never fails the build: without it the
    # Traffic section simply records views with no country.
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run prisma:deploy && npm run geo:country && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://www.amarkrishok.com,https://amarkrishok.com,https://amarkrishok.netlify.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
